name: chemCPA
channels:
  - pytorch
  - defaults
  - conda-forge
# Local compatibility pins for the working Torch/DeepChem/Seml stack on this branch.
dependencies:
  - python=3.9
  - adjusttext
  - matplotlib
  - numpy=1.26.4
  - pandas
  - scanpy
  - scipy=1.12.0
  - seaborn
  - scikit-learn
  - submitit
  - jupyter
  - jupytext
  - pytorch::pytorch=1.12.1
  - cudatoolkit=11.3
  - lightning=2.0.9.post0
  - torchmetrics=1.4.0.post0
  - intel-openmp=2022.1.0
  - mkl=2022.1.0
  - h5py
  - dglteam::dgl-cuda11.3
  - deepchem
  - rdkit=2021.09.2
  - descriptastorus=2.7.0.4
  - rich=13.9.4
  - sympy=1.12
  - pytest
  - pre-commit
  - seml
  - py-spy
  - fastparquet
  - gdown=5.2.0
  - wandb=0.16.5
  - hydra-core
  # UMAP
  - umap-learn
  - datashader
  - bokeh
  - holoviews
  - colorcet
  - scikit-image
  - pip
  - pip:
      # Pip-only packages needed by the current local environment.
      - pyarrow==16.0.0
      - tensorflow==2.18.0
      - dgllife==0.3.2
      - scgen==2.1.0
      - sfaira==0.3.12