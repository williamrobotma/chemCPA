name: chemCPA
channels:
  - pytorch
  - defaults
  - conda-forge
# Fork patch (williamrobotma): these pins describe the validated fork environment used for both local setup and the Docker build.
dependencies:
  - python=3.9
  - adjusttext
  - matplotlib
  - numpy=1.26.4
  - pandas
  - scanpy
  - scipy=1.12.0
  - seaborn
  - scikit-learn
  - submitit
  - jupyter
  - jupytext
  - pytorch::pytorch=1.12.1
  - cudatoolkit=11.3
  - lightning=2.0.9.post0
  - torchmetrics=1.4.0.post0
  - intel-openmp=2022.1.0
  - mkl=2022.1.0
  - h5py
  - dglteam::dgl-cuda11.3
  - deepchem
  - rdkit=2021.09.2
  - descriptastorus=2.7.0.4
  - rich=13.9.4
  - sympy=1.12
  - pytest
  - pre-commit
  - seml
  - py-spy
  - fastparquet
  - gdown=5.2.0
  - wandb=0.16.5
  - hydra-core
  # UMAP
  - umap-learn
  - datashader
  - bokeh
  - holoviews
  - colorcet
  - scikit-image
  - pip
  - pip:
      # Fork patch (williamrobotma): pin pip-only packages so the fork rebuild stays aligned with the validated stack.
      - pyarrow==16.0.0
      - tensorflow==2.18.0
      - dgllife==0.3.2
      - scgen==2.1.0
      - scvi-tools==1.0.4
      - chex==0.1.7
      - jax==0.4.18
      - jaxlib==0.4.18
      - flax==0.7.4
      - numpyro==0.15.0
      - optax==0.2.1
      - orbax-checkpoint==0.5.16
      - sparse==0.15.5
      - dm-tree==0.1.8
      - pyro-ppl==1.8.4
      - sfaira==0.3.12